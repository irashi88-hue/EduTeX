id: dark
name: "EduTeX Midnight Blue"
version: "1.0.0"
author: "EduTeX Project"

palette:
  canvas: "#0B1120"
  page_bg: "#111827"
  surface: "#18243A"
  ink: "#F3F6FA"
  muted: "#B8C4D6"
  link: "#7DD3FC"
  code_bg: "#0F1B2D"

styles:
  rule:
    label: "Rule"
    border_color: "#60A5FA"
    background_color: "#1B3558"
    font_weight: "bold"
    display: "block"

  note:
    label: "Note"
    border_color: "#F4C27A"
    background_color: "#3A2D22"
    font_weight: "normal"
    display: "block"

  example:
    label: "Example"
    border_color: "#5EEAD4"
    background_color: "#123B3A"
    font_weight: "normal"
    display: "block"

  exercise:
    label: "Exercise"
    border_color: "#C4B5FD"
    background_color: "#29254D"
    font_weight: "normal"
    display: "block"

  solution:
    label: "Solution"
    border_color: "#86EFAC"
    background_color: "#163A2A"
    font_weight: "normal"
    display: "block"

  vocab:
    label: ""
    border_color: "#93A9C7"
    background_color: "#1E2D46"
    font_weight: "normal"
    display: "card"

  conjugation:
    label: ""
    border_color: "#93A9C7"
    background_color: "#1E2D46"
    font_weight: "normal"
    display: "table"

  verb:
    label: ""
    border_color: "#93A9C7"
    background_color: "#1E2D46"
    font_weight: "normal"
    display: "card"

  formula:
    label: ""
    border_color: "#93A9C7"
    background_color: "#1E2D46"
    font_weight: "normal"
    display: "centered"

  _default:
    label: ""
    border_color: "#93A9C7"
    background_color: "#1E2D46"
    font_weight: "normal"
    display: "block"
