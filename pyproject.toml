[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edutex"
version = "0.4.0"
description = "EduTeX — A modular framework for generating educational documents from structured content."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
edutex = "edutex.core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edutex = [
    "project_template/*.md",
    "project_template/*.yaml",
    "project_template/assets/extensions/reading_tip/*.py",
    "project_template/assets/extensions/reading_tip/*.yaml",
    "project_template/assets/knowledge_models/*.md",
    "project_template/assets/layouts/default/*.yaml",
    "project_template/assets/themes/dark/*.yaml",
    "project_template/assets/themes/default/*.yaml",
    "project_template/assets/themes/default/template/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
